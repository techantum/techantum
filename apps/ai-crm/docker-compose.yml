services:
  ai-crm-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ai_crm
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD}
      POSTGRES_DB: ai_crm
    ports:
      - '5433:5432'
    volumes:
      - ai_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_crm -d ai_crm']
      interval: 5s
      timeout: 5s
      retries: 20

  ai-crm-web:
    build: .
    ports:
      - '4300:4300'
    env_file:
      - .env
    environment:
      CRM_WEB_PORT: '4300'
      CRM_DATA_ISOLATED: 'true'
      CRM_DATABASE_URL: postgresql://ai_crm:${CRM_DB_PASSWORD}@ai-crm-db:5432/ai_crm
      CRM_DIRECT_URL: postgresql://ai_crm:${CRM_DB_PASSWORD}@ai-crm-db:5432/ai_crm
    depends_on:
      ai-crm-db:
        condition: service_healthy
    command: npm run start

  ai-crm-worker:
    build: .
    env_file:
      - .env
    environment:
      CRM_DATA_ISOLATED: 'true'
      CRM_DATABASE_URL: postgresql://ai_crm:${CRM_DB_PASSWORD}@ai-crm-db:5432/ai_crm
      CRM_DIRECT_URL: postgresql://ai_crm:${CRM_DB_PASSWORD}@ai-crm-db:5432/ai_crm
    depends_on:
      ai-crm-db:
        condition: service_healthy
    command: npm run worker

volumes:
  ai_crm_data:
